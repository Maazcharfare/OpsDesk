name: opsdesk
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      OPSDESK_ENV: production
      OPSDESK_DB_PATH: /data/opsdesk.db
      OPSDESK_ALLOW_SERVICE_CHECKS: "false"
      LOG_LEVEL: INFO
    volumes:
      - opsdesk_data:/data
    expose:
      - "8000"
    networks:
      - backend
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 100
  proxy:
    image: nginx:1.28-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
    networks:
      - backend
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=16m
      - /var/run:size=4m
      - /tmp:size=8m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETGID
      - SETUID
networks:
  backend:
    driver: bridge
volumes:
  opsdesk_data:
