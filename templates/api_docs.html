<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#111827">
<meta name="description" content="Self-hosted API reference for OpsDesk IT Operations">
<title>OpsDesk API Reference</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<link rel="stylesheet" href="/static/app.css">
<link rel="stylesheet" href="/static/api_docs.css">
</head>
<body>
<header>
  <div class="topbar">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">O</div>
      <div><h1>OpsDesk</h1><p>IT operations workspace</p></div>
    </div>
    <nav class="topnav" aria-label="Main navigation">
      <a href="/">Dashboard</a>
      <a href="/openapi.json">OpenAPI JSON</a>
      <span class="environment">API REFERENCE</span>
    </nav>
  </div>
</header>
<main class="api-docs-shell">
  <div class="page-heading">
    <div>
      <h2>OpsDesk API reference</h2>
      <p class="subtext">Browse the endpoints OpsDesk provides and the data they accept.</p>
    </div>
    <span class="count-pill" id="apiVersion">Loading schema…</span>
  </div>
  <section class="card api-docs-card" aria-label="API endpoints">
    <div class="section-head">
      <div><h2>Endpoints</h2><p class="subtext" id="apiSummary">Loading endpoint definitions…</p></div>
      <a class="schema-link" href="/openapi.json">View raw schema</a>
    </div>
    <p class="message api-docs-message" id="apiMessage" role="status" aria-live="polite"></p>
    <div class="endpoint-list" id="apiEndpoints" aria-live="polite"></div>
  </section>
  <footer>OpsDesk <span aria-hidden="true">·</span> Local API reference</footer>
</main>
<script src="/static/api_docs.js" defer></script>
</body>
</html>
