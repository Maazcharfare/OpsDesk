name: tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pip-audit -r requirements-dev.txt
      - run: python -m py_compile main.py test_main.py test_database_tools.py scripts/backup_db.py scripts/restore_db.py scripts/seed_demo.py
      - run: python -m pytest -q
